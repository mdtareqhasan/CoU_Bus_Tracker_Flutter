name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: release
        options:
          - release
          - debug
      track:
        description: 'Internal release name (used as artifact suffix)'
        required: false
        type: string
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Persist ~/.gradle (dependency + wrapper cache) across runs instead
          # of re-downloading every Maven/Gradle artifact on each build.
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Must satisfy pubspec `sdk: ^3.8.0` (3.27.1 shipped Dart 3.6 and
          # failed at `flutter pub get`), and should match the local toolchain
          # so `dart format` / `flutter analyze` agree with a dev machine.
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Determine build type
        id: build_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.build_type }}" >> "$GITHUB_OUTPUT"
            echo "track=${{ github.event.inputs.track }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "track=ci-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Release builds must be signed with the same key on every run and on
      # the same key a dev machine uses, otherwise the APKs are mutually
      # uninstallable (fresh runners would otherwise auto-generate a new
      # random debug keystore per run). The keystore + passwords live in
      # repo secrets (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) and are materialized as
      # android/key.properties, which android/app/build.gradle.kts already
      # reads. Never echo secret values: only test for emptiness.
      - name: Configure signing (release)
        if: steps.build_type.outputs.type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Set ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in the repo's Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=../upload-keystore.jks"
          } > android/key.properties

      # One Gradle build per release: the signed AAB below is the single
      # source of truth, and the sideloadable APK is derived from it with
      # bundletool (Google's official AAB->APK tool, pure Java) instead of a
      # second full `flutter build apk` pass.
      - name: Build App Bundle (release)
        if: steps.build_type.outputs.type == 'release'
        run: flutter build appbundle --release

      - name: Build APK (debug)
        if: steps.build_type.outputs.type == 'debug'
        run: flutter build apk --debug

      # Turn the signed AAB into a single universal (all-ABIs) APK signed
      # with the same release keystore, so it installs as an upgrade over
      # every other correctly-signed build.
      - name: Derive universal APK from AAB (bundletool)
        if: steps.build_type.outputs.type == 'release'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          curl -fsSL -o /tmp/bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=build/app/outputs/bundle/release/app-release.aab \
            --output=/tmp/app.apks \
            --mode=universal \
            --ks=android/upload-keystore.jks \
            --ks-pass="pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass="pass:$KEY_PASSWORD"
          # The .apks archive is a zip; universal.apk is the all-ABIs APK we
          # sideload. Place it where the upload step already looks.
          mkdir -p build/app/outputs/flutter-apk
          unzip -p /tmp/app.apks universal.apk > build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: List build artifacts
        if: always()
        run: |
          echo "--- build/app/outputs/ ---"
          ls -lhR build/app/outputs/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cou-bus-tracker-apk-${{ steps.build_type.outputs.type }}-${{ steps.build_type.outputs.track }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB artifact
        if: steps.build_type.outputs.type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cou-bus-tracker-aab-${{ steps.build_type.outputs.track }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
